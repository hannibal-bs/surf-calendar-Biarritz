name: Publish surf calendar

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 05:17 UTC. For tide data, exact minute is not critical.
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate surf calendar
        run: |
          mkdir -p public
          python surf_calendar_generator.py \
            --source "webcal://webcaltides.org/tides/T232e6c9.ics?units=metric" \
            --output "public/surf-biarritz.ics" \
            --timezone "Europe/Paris" \
            --calendar-name "Surf — Biarritz" \
            --target-height-m 2.90 \
            --window-duration-minutes 90 \
            --day-start-hour 7 \
            --day-end-hour 22 \
            --min-duration-minutes 60 \
            --preview 0

      - name: Add landing page
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Calendrier surf — Biarritz</title>
          </head>
          <body>
            <h1>Calendrier surf — Biarritz</h1>
            <p>Calendrier généré automatiquement à partir des horaires de marées.</p>
            <ul>
              <li>Créneau de 90 minutes autour du passage à 2,90 m (hauteur provisoire)</li>
              <li>Marée montante et descendante</li>
              <li>Créneaux limités à 07:00-22:00</li>
              <li>Durée minimale après troncature : 60 minutes</li>
              <li>Prévisions indicatives : la sécurité d'accès n'est pas évaluée</li>
            </ul>
            <p><a href="surf-biarritz.ics">Télécharger / s’abonner au fichier ICS</a></p>
          </body>
          </html>
          HTML
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
